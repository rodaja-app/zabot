name: zabot
description: "ZaBot — app de disparo em massa via WhatsApp com sessões, contatos inteligentes e campanhas."
publish_to: "none"
version: 0.4.0+30

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any
  rive: ^0.13.13
  cupertino_icons: ^1.0.8
  # Etapa 18 (integração final) — infraestrutura de API/tempo real do front,
  # até aqui inexistente porque nenhuma tela falava com o backend de
  # verdade (só com os Mock*Repository em memória, ver README §13).
  http: ^1.6.0
  http_parser: ^4.0.2
  socket_io_client: ^3.1.6
  flutter_secure_storage: ^10.3.1
  # Seleção real de arquivo de mídia de campanha (Menu 2, seção "Mídia") —
  # antes da Etapa 18 a tela só marcava um tipo/contagem visual, sem
  # capturar bytes de verdade (ver `nova_campanha_screen.dart`).
  file_picker: ^8.1.2
  # Fotos usam o seletor da galeria do sistema; áudio e documentos continuam
  # no seletor de arquivos apropriado para esses formatos.
  image_picker: ^1.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/animations/
