services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: zabot
      POSTGRES_PASSWORD: zabot
      POSTGRES_DB: zabot
    ports:
      - '5432:5432'
    volumes:
      - zabot_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U zabot']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - '6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      target: build
    command: npm run start:dev
    env_file: .env
    environment:
      DATABASE_URL: postgresql://zabot:zabot@postgres:5432/zabot
      REDIS_URL: redis://redis:6379
    ports:
      - '3000:3000'
    volumes:
      - ./src:/app/src
      - ./prisma:/app/prisma
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  zabot_postgres_data:
