workflows:
  ios-workflow:
    name: iOS - Zabot (TestFlight)
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: Codemagic2
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.rodajaapp.zabot
      flutter: stable
      xcode: latest
      cocoapods: default
    scripts:
      - name: Buscar dependências do Flutter
        script: flutter packages pub get
      - name: Instalar CocoaPods
        script: |
          find . -name "Podfile" -execdir pod install \;
      - name: Configurar assinatura de código no projeto Xcode
        script: xcode-project use-profiles
      - name: Build do IPA
        script: |
          # --build-number=$PROJECT_BUILD_NUMBER (contador nativo do Codemagic,
          # incrementa a cada build do projeto, nunca reseta) substitui o "+N"
          # do pubspec.yaml só pro CFBundleVersion — evita o erro "bundle
          # version must be higher than the previously uploaded version" toda
          # vez que um build é reenviado ao TestFlight sem editar o pubspec à
          # mão antes. O nome da versão (0.2.1) continua vindo do pubspec.yaml
          # normalmente, sem precisar passar --build-name.
          flutter build ipa --release \
            --build-number=$PROJECT_BUILD_NUMBER \
            --export-options-plist=/Users/builder/export_options.plist
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
